[project]
name = "aquanexus-backend"
version = "0.1.0"
description = "AquaNexus Global Water Intelligence Platform - backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]
# Reading NASA GPM IMERG NetCDF4 granules. Kept optional so the base app and
# every credential-free provider keep running with no scientific stack.
imerg = ["xarray>=2023.1", "h5netcdf>=1.3", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

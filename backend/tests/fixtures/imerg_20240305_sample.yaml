# Reference values for the NASA GPM IMERG Late Daily V07 (GPM_3IMERGDL) adapter.
#
# These are NOT live data. They are carefully structured fixtures that mirror
# the V07 variable definitions and the documented value semantics so the
# interpreter can be tested deterministically and offline.
#
# Product facts being exercised (see docs/DATA_SOURCES.md):
#   * precipitation        mm/day   float32  fill = -9999.900390625
#   * precipitation_cnt    count    int8     0..48 valid half-hourly retrievals
#   * a cell with count == 0 is FILL, i.e. no estimate (never 0 mm)
#   * a cell with count > 0 and value 0.0 is a VALID dry day
#
# One canonical synthetic granule: 2024-03-05, 3x3 grid.
product: GPM_3IMERGDL
version: "07"
day: "2024-03-05"
grid:
  lat: [-10.0, -9.9, -9.8]
  lon: [20.0, 20.1, 20.2]
variables:
  precipitation:
    # row 0: valid dry, valid wet, filled
    - [0.0, 12.5, -9999.900390625]
    # row 1: valid light, filled, valid wet
    - [1.4, -9999.900390625, 30.0]
    # row 2: filled, filled, valid dry
    - [-9999.900390625, -9999.900390625, 0.0]
  precipitation_cnt:
    - [48, 24, 0]
    - [30, 0, 48]
    - [0, 0, 20]
# Grid-cell centres used for nearest-cell lookups.
point_samples:
  - latitude: -10.0
    longitude: 20.0
    value: 0.0          # valid dry: count 48
    count: 48
  - latitude: -9.9
    longitude: 20.1
    value: 12.5
    count: 24
  - latitude: -9.8
    longitude: 20.2
    value: null         # filled: count 0 -> None, NOT 0.0
    count: 0
